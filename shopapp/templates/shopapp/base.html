<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Магазин{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        header { background: #fff; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        nav a { margin: 0 10px; color: #333; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        main { background: #fff; padding: 20px; border-radius: 8px; margin-top: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        footer { margin-top: 20px; text-align: center; color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <header>
        <h1>Магазин</h1>
        <nav>
            <a href="{% url 'shopapp:shop_index' %}">Главная</a>
            <a href="{% url 'shopapp:products_list' %}">Товары</a>
            <a href="{% url 'shopapp:orders_list' %}">Заказы</a>
            
            {% if user.is_authenticated %}
                <a href="{% url 'myauth:logout' %}">Выйти ({{ user.username }})</a>
            {% else %}
                <a href="{% url 'myauth:login' %}">Войти</a>
                <a href="{% url 'myauth:register' %}">Регистрация</a>
            {% endif %}
        </nav>
    </header>
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <p>&copy; 2024 Все права защищены</p>
    </footer>
</body>
</html>
